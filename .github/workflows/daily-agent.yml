# Free daily agent run on GitHub Actions (public repo: unlimited minutes; private: 2,000/mo free).
# Secrets: LLM_PROVIDER, LLM_BASE_URL, LLM_API_KEY, LLM_MODEL (e.g. Groq/Gemini free tier) or ANTHROPIC_API_KEY,
#          GOOGLE_SERVICE_ACCOUNT_JSON, SHEET_ID, RESUME_TEXT, RULES_JSON (your profile: contents of backend/rules.json)
# Privacy: on a public repo, run logs are public. Leads go to your Sheet; nothing personal is uploaded as an artifact.
name: daily-job-agent
on:
  schedule:
    - cron: "7 12 * * 1-5"   # 7:07 ET weekdays
  workflow_dispatch:
permissions:
  contents: read   # least privilege: the run only reads the repo
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with: { path: backend/leads.db, key: leads-db-${{ github.run_id }}, restore-keys: leads-db- }
      - run: python run_agent.py --min-fit 40
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          RULES_JSON: ${{ secrets.RULES_JSON }}
      - uses: actions/cache/save@v4
        if: always()
        with: { path: backend/leads.db, key: leads-db-${{ github.run_id }} }
