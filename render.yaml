services:
  - type: web
    name: jobfinder-backend
    env: python
    pythonVersion: "3.11.9"
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_TOKEN        # set in the Render dashboard; without it the public API is open to anyone
        sync: false
      - key: ALLOWED_ORIGINS  # the Vercel frontend's origin, e.g. https://your-app.vercel.app (frontend is deployed separately, see vercel.json)
        sync: false
      - key: RULES_JSON       # your profile (contents of backend/rules.json); never commit it
        sync: false
      - key: SESSION_SECRET   # set in the Render dashboard; signs per-user session tokens (see docs/MULTI_USER_SETUP.md)
        sync: false
      - key: DATA_REPO_TOKEN  # optional: fine-grained PAT for the private jobfinder-data repo (contents:write + actions:write on it only); unset = runs fully in-process as before
        sync: false
      - key: DATA_REPO        # optional: "your-github-username/jobfinder-data"; leave unset until DATA_REPO_TOKEN is set up
        sync: false
